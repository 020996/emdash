<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emdash</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('emdash-theme');
          var pref = raw ? JSON.parse(raw) : null;
          // Presets store their polarity class beside the theme (see theme-classes.ts).
          var stored = localStorage.getItem('emdash-theme-polarity');
          var effective =
            pref === 'emlight' || pref === 'emdark'
              ? pref
              : pref && (stored === 'emlight' || stored === 'emdark')
                ? stored
                : window.matchMedia('(prefers-color-scheme: dark)').matches
                  ? 'emdark'
                  : 'emlight';
          document.documentElement.classList.add(effective);
          if (pref && pref !== effective && effective === stored) {
            document.documentElement.classList.add(pref, 'em-preset');
          }
          // sRGB approximations of the theme --background / --foreground
          // tokens, applied before any stylesheet loads so the very first
          // paint (and the boot splash) match the persisted theme.
          if (localStorage.getItem('emdash-glass') === '1') {
            document.documentElement.classList.add('em-glass');
          }
          // See-through window: no opaque paint, or the desktop never shows through.
          var transparent = localStorage.getItem('emdash-transparent') === '1';
          if (transparent) document.documentElement.classList.add('em-transparent');
          var isDark = effective === 'emdark';
          var style = document.documentElement.style;
          var bg = transparent ? 'transparent' : isDark ? '#111111' : '#fcfcfc';
          style.backgroundColor = bg;
          style.setProperty('--boot-splash-bg', bg);
          style.setProperty('--boot-splash-fg', isDark ? '#eeeeee' : '#202020');
        } catch (_) {}
      })();
    </script>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background-color: var(--boot-splash-bg, #fcfcfc);
        color: var(--boot-splash-fg, #202020);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell,
          'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        user-select: none;
        cursor: default;
        opacity: 1;
        transition: opacity 180ms ease-out;
        -webkit-app-region: drag;
      }
      #boot-splash.boot-splash-done {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash .boot-splash-logo {
        height: 26px;
        width: auto;
        fill: var(--boot-splash-fg, #202020);
        opacity: 0.9;
      }
      #boot-splash .boot-splash-progress {
        position: relative;
        width: 132px;
        height: 2px;
        border-radius: 1px;
        overflow: hidden;
        background-color: color-mix(in srgb, var(--boot-splash-fg, #202020) 14%, transparent);
        opacity: 0;
        animation: boot-splash-reveal 240ms ease-out 1200ms forwards;
      }
      #boot-splash .boot-splash-progress::before {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 40%;
        border-radius: 1px;
        background-color: color-mix(in srgb, var(--boot-splash-fg, #202020) 55%, transparent);
        animation: boot-splash-slide 1.3s ease-in-out infinite;
      }
      #boot-splash-escape {
        position: absolute;
        bottom: 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        font-size: 13px;
        color: color-mix(in srgb, var(--boot-splash-fg, #202020) 72%, transparent);
      }
      #boot-splash-escape[hidden] {
        display: none;
      }
      #boot-splash-escape p {
        margin: 0;
      }
      .boot-splash-escape-actions {
        display: flex;
        gap: 8px;
      }
      .boot-splash-escape-actions button {
        -webkit-app-region: no-drag;
        appearance: none;
        font: inherit;
        font-size: 12px;
        color: var(--boot-splash-fg, #202020);
        background: transparent;
        border: 1px solid color-mix(in srgb, var(--boot-splash-fg, #202020) 30%, transparent);
        border-radius: 6px;
        padding: 5px 12px;
        cursor: pointer;
      }
      .boot-splash-escape-actions button:hover {
        background-color: color-mix(in srgb, var(--boot-splash-fg, #202020) 8%, transparent);
      }
      @keyframes boot-splash-reveal {
        to {
          opacity: 1;
        }
      }
      @keyframes boot-splash-slide {
        0% {
          left: -40%;
        }
        100% {
          left: 100%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-splash-progress {
          animation-duration: 1ms;
        }
        #boot-splash .boot-splash-progress::before {
          animation: none;
          left: 30%;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <svg class="boot-splash-logo" viewBox="0 0 58 70" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="boot-splash-mark" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#22c1c3" />
            <stop offset="1" stop-color="#5b5bf0" />
          </linearGradient>
        </defs>
        <rect x="0" y="12" width="58" height="58" rx="13" fill="url(#boot-splash-mark)" />
        <rect x="10.7" y="27.4" width="36.6" height="28.8" rx="9.8" fill="#0e1020" fill-opacity="0.86" />
        <line x1="29" y1="27.4" x2="29" y2="6" stroke="#22c1c3" stroke-width="3.6" stroke-linecap="round" />
        <circle cx="29" cy="5" r="4.5" fill="#22c1c3" />
        <rect x="19.9" y="37.6" width="4.7" height="7.9" rx="2.3" fill="#7ef9ff" />
        <rect x="33.5" y="37.6" width="4.7" height="7.9" rx="2.3" fill="#7ef9ff" />
      </svg>
      <div class="boot-splash-progress"></div>
      <div id="boot-splash-escape" hidden>
        <p>Emdash is taking longer than expected to start.</p>
        <div class="boot-splash-escape-actions">
          <button id="boot-splash-restart" type="button">Restart Emdash</button>
          <button id="boot-splash-recovery" type="button">Open recovery</button>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
